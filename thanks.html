<body>
<main>
  <section class="hero" style="min-height: 100vh; display: flex; align-items: center;">
    <div class="hero-stars" aria-hidden="true"></div>
    <div class="hero-inner" style="grid-template-columns: 1fr; text-align: center; justify-items: center;">
      <div>
        <p class="eyebrow" id="ty-eyebrow">Message received</p>
        <h1 class="hero-title" id="ty-title">Thank you!</h1>
        <p class="hero-sub" id="ty-sub" style="margin-inline: auto;">Your message is on its way to Brian. Keep an eye on your inbox.</p>

          <a class="btn btn-gold" id="ty-main" href="/">Back to the site</a>

      </div>

</main>
<script>
  /* Forms send people here as thanks.html?signup=newsletter or thanks.html?sent=contact */
  (function () {
    if (!/[?&]signup=newsletter\b/.test(location.search)) return;
    document.title = "You're on the list | Brian Young";
    document.getElementById("ty-eyebrow").textContent = "You're on the list";
    document.getElementById("ty-title").textContent = "Welcome to the reader crew";
    document.getElementById("ty-sub").textContent = "Release news and launch extras will come to your inbox. Every email has an unsubscribe link. While you wait, hear the first chapter free.";
    var main = document.getElementById("ty-main");
    main.textContent = "Hear Chapter One";
    main.href = "/listen-chapter-one-v9t4pz/";
    document.getElementById("ty-alt").hidden = false;
  })();
</script>
